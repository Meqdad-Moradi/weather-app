<mat-toolbar class="flex items-center justify-between" color="primary">
  <div class="flex items-center gap-4">
    <button class="text-white!" matIconButton (click)="toggleSideNav()">
      <mat-icon>menu</mat-icon>
    </button>
    <h1 class="font-semibold! text-white">{{ title() }}</h1>
  </div>
  <div>
    <!-- theme switcher -->
    <app-switch-theme />

    <!-- login button -->
    <button class="text-white!" matIconButton [mat-menu-trigger-for]="menu">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
