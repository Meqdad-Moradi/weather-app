<h2 class="bg-(--bg) mb-0!" matDialogTitle>{{ data?.title || 'Confirm' }}</h2>
<mat-dialog-content class="bg-(--bg)">
  <span>{{ data?.message || '' }}</span>
</mat-dialog-content>

<mat-dialog-actions class="bg-(--bg)">
  <button mat-button mat-dialog-close>{{ data?.cancelText || 'Cancel' }}</button>
  <button mat-button [mat-dialog-close]="true">
    {{ data?.confirmText || 'Confirm' }}
  </button>
</mat-dialog-actions>
